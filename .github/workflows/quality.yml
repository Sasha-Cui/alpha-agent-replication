name: Public reproducibility gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Install locked package and test dependencies
        run: |
          python -m pip install "pip==24.2"
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Lint Python sources and tests
        run: python -m ruff check src scripts tests
      - name: Validate public repository and submission package
        run: python scripts/validate_submission_package.py
