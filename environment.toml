# Environment manifest. Keep this file tracked; do not track installed packages or virtualenv directories.
schema_version = 1
project = "alpha-agent-replication"
central_registry = "/home/zc362/project_pi_btk22/zc362/environments"
policy = "Installed packages live in the central registry; this project tracks only source code and environment specifications."

[[environment]]
name = "main"
central_alias = "alpha-evolve"
interpreter = "/home/zc362/project_pi_btk22/zc362/environments/current/alpha-evolve/bin/python"
python = "3.9"
usage = "Public package, audit builders, tests, and manuscript validation."
lock = "requirements-lock.txt"
install = "python -m pip install --require-hashes -r requirements-lock.txt && python -m pip install --no-deps -e ."

[specs]
project = "pyproject.toml"
lock = "requirements-lock.txt"
package = ["external_repos/*/pyproject.toml"]
requirements = ["external_repos/*/requirements.txt"]
native_locks = ["external_repos/*/uv.lock", "external_repos/*/poetry.lock"]

[dependencies]
direct = ["matplotlib", "numpy", "pandas", "pyarrow", "pypdf", "scipy", "statsmodels"]
development = ["pytest", "ruff"]

[notes]
items = [
  "Do not install through the project-local .venv compatibility symlink.",
  "Build and validate a versioned environment under environments/venvs before repointing the central alias.",
  "Do not vendor external repository packages into this project tree.",
]


[[environment]]
name = "economic-fidelity-native"
central_alias = "alpha-economic-fidelity"
interpreter = "/nfs/roberts/project/pi_btk22/zc362/environments/current/alpha-economic-fidelity/bin/python"
python = "3.10"
usage = "Native FinMem and FinAgent source execution, with metered model transports. Use scripts/run_finmem_fidelity_python.sh for native library paths."
lock = "environment_specs/publication_fidelity_native.json"
parent_lock = "paper_runs/paper_replication_audits/finagent/paper_era_environment_freeze.txt"

[[environment]]
name = "publication-report"
central_alias = "kt-default"
interpreter = "/nfs/roberts/project/pi_btk22/zc362/environments/current/kt-default/bin/python"
python = "3.12"
usage = "Read-only analytical report and ReportLab manuscript rendering from completed result tables."
lock = "environment_specs/publication_report_runtime.json"

[[native_tool]]
name = "efs-octave"
version = "9.2.0"
central_alias = "octave-efs"
executable = "/nfs/roberts/project/pi_btk22/zc362/environments/bin/efs-octave"
versioned_prefix = "/nfs/roberts/project/pi_btk22/zc362/environments/venvs/octave-9.2.0-efs-20260921-v2"
lock = "/nfs/roberts/project/pi_btk22/zc362/environments/specs/octave-9.2.0-efs-20260921-v2.explicit.txt"
usage = "EFS cited-baseline reruns. Pass the wrapper via --octave; it sets OCTAVE_HOME and OCTAVE_EXEC_HOME for the central project runtime."
