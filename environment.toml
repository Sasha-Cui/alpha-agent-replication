# Environment manifest. Keep this file tracked; do not track installed packages or virtualenv directories.
schema_version = 1
project = "alpha-agent-replication"
central_registry = "/home/zc362/project_pi_btk22/zc362/environments"
policy = "Installed packages live in the central registry; this project tracks only source code and environment specifications."

[[environment]]
name = "main"
central_alias = "alpha-evolve"
interpreter = "/home/zc362/project_pi_btk22/zc362/environments/current/alpha-evolve/bin/python"
python = "3.9"
usage = "Public package, audit builders, tests, and manuscript validation."
lock = "requirements-lock.txt"
install = "python -m pip install --require-hashes -r requirements-lock.txt && python -m pip install --no-deps -e ."

[specs]
project = "pyproject.toml"
lock = "requirements-lock.txt"
package = ["external_repos/*/pyproject.toml"]
requirements = ["external_repos/*/requirements.txt"]
native_locks = ["external_repos/*/uv.lock", "external_repos/*/poetry.lock"]

[dependencies]
direct = ["matplotlib", "numpy", "pandas", "pyarrow", "pypdf", "scipy", "statsmodels"]
development = ["pytest", "ruff"]

[notes]
items = [
  "Do not install through the project-local .venv compatibility symlink.",
  "Build and validate a versioned environment under environments/venvs before repointing the central alias.",
  "Do not vendor external repository packages into this project tree.",
]
